<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GW Odontologia | Dentista em Pinheiros, São Paulo - SP</title>
<meta name="description" content="Clínica odontológica em Pinheiros liderada pelo Dr. Guilad Weil (USP). Atendimento especializado em bruxismo, canal em sessão única, laserterapia e clínica geral.">
<meta name="theme-color" content="#12324a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="wa" viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.5z"/><path d="M9 8.5c0 3 3 6 6 6l1-1.5-2-1-1 .8c-1-.5-1.8-1.3-2.3-2.3l.8-1-1-2z"/></symbol></svg>
<a class="skip" href="#main">Ir para o conteúdo</a>

<header id="top">
  <div class="w hd">
    <a href="#inicio" class="logo" id="logo" aria-label="Início"></a>
    <nav id="nav" aria-label="Principal">
      <a href="#inicio">Início</a>
      <a href="#sobre" data-nav="about">Sobre</a>
      <a href="#resultados" data-nav="results">Resultados</a>
      <a href="#servicos" data-nav="services">Serviços</a>
      <a href="#avaliacoes" data-nav="testimonials">Avaliações</a>
      <a href="#faq" data-nav="faq">Dúvidas</a>
      <a href="#contato">Contato</a>
    </nav>
    <div class="hr">
      <a class="btn wpp" href="#contato"><svg><use href="#wa"/></svg><span data-t="contact.buttonShort"></span></a>
      <button class="burger" id="burger" aria-label="Abrir menu" aria-expanded="false"><i></i><i></i><i></i></button>
    </div>
  </div>
</header>

<main id="main">
<section class="hero" id="inicio">
  <div class="w hg">
    <div>
      <div class="eyebrow" data-t="hero.eyebrow"></div>
      <h1 id="heroTitle"></h1>
      <p class="lead" data-t="hero.text"></p>
      <div class="hb">
        <a class="btn wpp" href="#contato"><svg><use href="#wa"/></svg><span data-t="hero.cta"></span></a>
        <a class="btn ghost" href="#servicos" data-t="hero.secondary"></a>
      </div>
      <ul class="chk" id="heroChecks"></ul>
    </div>
    <div class="hi">
      <div class="slot" data-img="hero" data-name="Foto principal"></div>
      <div class="badge-card"><span class="ic">✓</span><div><b data-t="hero.badgeTitle"></b><small data-t="hero.badgeText"></small></div></div>
    </div>
  </div>
</section>

<div class="mq" data-section="marquee" aria-hidden="true"><div id="mq"></div></div>

<section id="sobre" data-section="about">
  <div class="w sg">
    <div class="fr"><div class="slot" data-img="about" data-name="Foto sobre"></div></div>
    <div>
      <div class="eyebrow" data-t="about.eyebrow"></div>
      <h2 data-t="about.title"></h2>
      <div id="aboutText"></div>
      <div class="st" id="stats"></div>
      <a class="btn wpp" href="#contato"><svg><use href="#wa"/></svg><span data-t="about.cta"></span></a>
    </div>
  </div>
</section>

<section class="alt" id="resultados" data-section="results">
  <div class="w center">
    <div class="eyebrow" data-t="results.eyebrow"></div>
    <h2 data-t="results.title"></h2>
    <p class="sub" data-t="results.sub"></p>
    <div class="cards ba" id="results"></div>
  </div>
</section>

<section id="servicos" data-section="services">
  <div class="w">
    <div class="eyebrow" data-t="services.eyebrow"></div>
    <h2 data-t="services.title"></h2>
    <p class="sub" data-t="services.sub"></p>
    <div class="cards tg" id="services"></div>
  </div>
</section>

<section class="pad0" id="diferencial" data-section="differential">
  <div class="w">
    <div class="dif">
      <div class="slot" data-img="space" data-name="Foto do espaço"></div>
      <div class="t">
        <div class="eyebrow light" data-t="differential.eyebrow"></div>
        <h2 data-t="differential.title"></h2>
        <p data-t="differential.text"></p>
        <ul id="difList"></ul>
        <a class="btn wpp" href="#contato"><svg><use href="#wa"/></svg><span data-t="differential.cta"></span></a>
      </div>
    </div>
  </div>
</section>

<section class="alt" id="avaliacoes" data-section="testimonials">
  <div class="w center">
    <div class="eyebrow" data-t="testimonials.eyebrow"></div>
    <h2 data-t="testimonials.title"></h2>
    <p class="sub" data-t="testimonials.sub"></p>
    <div class="cards ag" id="reviews"></div>
  </div>
</section>

<section class="why" data-section="why">
  <div class="w">
    <div class="eyebrow light" data-t="why.eyebrow"></div>
    <h2 data-t="why.title"></h2>
    <div class="cards wg" id="why"></div>
  </div>
</section>

<section id="faq" data-section="faq">
  <div class="w narrow">
    <div class="center">
      <div class="eyebrow" data-t="faq.eyebrow"></div>
      <h2 data-t="faq.title"></h2>
    </div>
    <div class="faq" id="faqList"></div>
  </div>
</section>

<div class="w" id="contato">
  <div class="cta">
    <h2 data-t="cta.title"></h2>
    <p data-t="cta.text"></p>
    <a class="btn wpp" href="#contato"><svg><use href="#wa"/></svg><span data-t="cta.button"></span></a>
  </div>
</div>
</main>

<footer>
  <div class="w fg">
    <div>
      <div class="flogo" id="flogo"></div>
      <p data-t="footer.about"></p>
    </div>
    <div>
      <h4>Navegação</h4>
      <div id="fnav"></div>
    </div>
    <div>
      <h4>Contato</h4>
      <div id="fcontact"></div>
    </div>
  </div>
  <div class="w fb"><span id="copy"></span><span data-t="footer.credit"></span></div>
</footer>

<a class="wa wpp" href="#contato" aria-label="Falar pelo WhatsApp"><svg><use href="#wa"/></svg></a>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
